# Production stack: Caddy (HTTPS) -> app (API + frontend) -> PostgreSQL.
# Values come from deploy/.env on the server (DOMAIN, POSTGRES_PASSWORD).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    # Sized for a 1 GB server shared with the app.
    command: postgres -c shared_buffers=96MB -c max_connections=30 -c work_mem=4MB
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    image: vodafone-crm:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD}@db:5432/crm?sslmode=disable
      APP_ENV: production
      APP_ORIGIN: https://${DOMAIN:?set in .env}
      TRUST_PROXY: "true"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
